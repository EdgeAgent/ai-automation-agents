<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">AI Automation Agents</title>
  <desc id="desc">Three agent nodes routing into one hub, in teal, gold, and cyan on deep navy.</desc>
  <defs>
    <linearGradient id="bg" x1="12" y1="8" x2="116" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#060A14"/>
      <stop offset="1" stop-color="#111B36"/>
    </linearGradient>
    <linearGradient id="stroke" x1="28" y1="28" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF"/>
      <stop offset=".55" stop-color="#58B9FF"/>
      <stop offset="1" stop-color="#E8B84B"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)" stroke="#314564" stroke-width="2"/>
  <g fill="none" stroke="url(#stroke)" stroke-linecap="round" stroke-width="5">
    <path d="M36 32 L56 56 M92 32 L72 56 M64 96 L64 74"/>
    <path d="M64 84 m0 0" stroke-width="1"/>
  </g>
  <g fill="#EAF6FF" stroke="#13223D" stroke-width="3" filter="url(#glow)">
    <circle cx="34" cy="30" r="8"/>
    <circle cx="94" cy="30" r="8"/>
    <circle cx="64" cy="102" r="8"/>
  </g>
  <circle cx="64" cy="64" r="12" fill="#E8B84B" stroke="#13223D" stroke-width="3" filter="url(#glow)"/>
</svg>
